name: Build and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the application
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out the native SDK compiler
        uses: actions/checkout@v6
        with:
          repository: Aquarius-Language/AquariusLangTW
          ref: 253e3181eb46a3229d572286ae9dd4464c908068
          path: .compiler
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the pinned native runtime packs and compiler
        run: |
          & .compiler/scripts/install-toolchain.ps1 -Targets windows-x64,web
          & .compiler/scripts/build-runtime.ps1 -Targets windows-x64,web
          & .compiler/scripts/publish-cli.ps1 -Output dist/aqua
          if ($LASTEXITCODE -ne 0) { throw 'Compiler/runtime build failed.' }
          (Resolve-Path .compiler/dist/aqua).Path >> $env:GITHUB_PATH
      - name: Build and verify the website
        run: |
          ./建置.ps1 -略過桌面
          foreach ($file in @('index.html','app.mjs','aquarius.json','program.wasm','glue/index.mjs','runtime/aquarius.wasm')) {
            if (-not (Test-Path -LiteralPath (Join-Path '網頁' $file) -PathType Leaf)) {
              throw "Missing website output: $file"
            }
          }
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '網頁'
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the website
        id: deployment
        uses: actions/deploy-pages@v4
